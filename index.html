<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Wine Alchemist CRM</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WA CRM">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7F9; --side:#F5F5F7;
  --fg:#1C1C1E; --fg2:#6C6C70; --fg3:#8E8E93; --sep:#E5E5EA; --border:#D1D1D6;
  --accent:#7A1F2B; --accent-tint:#F4E9EB; --fill:#EFEFF3;
  --green:#1F7A35; --green-t:#E3F4E7; --orange:#9A4A00; --orange-t:#FFF0DC;
  --blue:#0058B0; --blue-t:#E3EFFC; --purple:#4B49B8; --purple-t:#ECEBFB;
  --red:#B3261E; --red-t:#FCE6E4; --gold:#7A5A1E; --gold-t:#F3EBDD; --grey-t:#EDEDF0;
  --r:14px; --tab:84px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --card:#1C1C1E; --card2:#121214; --side:#151517;
  --fg:#F2F2F7; --fg2:#98989F; --fg3:#8E8E93; --sep:#2C2C2E; --border:#3A3A3C;
  --accent:#D98A96; --accent-tint:#2A1216; --fill:#2C2C2E;
  --green:#5CD07A; --green-t:#14301B; --orange:#F0A23C; --orange-t:#33220A;
  --blue:#6BB6FF; --blue-t:#0C2440; --purple:#A9A7FF; --purple-t:#1D1C3A;
  --red:#FF8A80; --red-t:#3A1512; --gold:#D9B96A; --gold-t:#2E2513; --grey-t:#2C2C2E;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.35 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{margin:0;letter-spacing:-.02em}
h1{font-size:30px;font-weight:700}
h2{font-size:20px;font-weight:700}
h3{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.03em}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
#side{display:none}
#main{flex:1;min-width:0;padding:max(16px,env(safe-area-inset-top)) 16px calc(var(--tab) + 20px) 16px}
#tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding-top:6px;z-index:40}
#tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px;font-size:10px;font-weight:600;color:var(--fg3)}
#tabbar a.on{color:var(--accent)}
@media (min-width:1024px){
  #app{flex-direction:row}
  #side{display:flex;flex-direction:column;gap:22px;width:232px;flex-shrink:0;background:var(--side);
    border-right:1px solid var(--border);padding:26px 12px 16px;position:sticky;top:0;height:100vh}
  #main{padding:26px 28px 40px;max-width:1400px}
  #tabbar{display:none}
}
#side .brand{padding:0 10px;font-family:Georgia,"Times New Roman",serif;font-size:23px;color:var(--accent)}
#side nav{display:flex;flex-direction:column;gap:2px}
#side nav a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:8px;
  font-size:14px;font-weight:500;color:var(--fg)}
#side nav a.on{background:var(--accent);color:#fff}
#side nav a .n{margin-left:auto;font-size:12px;color:var(--fg2)}
#side nav a.on .n{color:#fff}
#side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px 10px}

/* ---------- componenti iOS ---------- */
.group{display:flex;flex-direction:column;gap:6px;margin:18px 0}
.group>h3{padding:0 16px}
.inset{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:9px 14px;border-top:1px solid var(--sep);
  background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit}
.inset>.row:first-child,.inset>a:first-child .row,.inset>*:first-child{border-top:0}
.row.col{flex-direction:column;align-items:stretch;gap:6px}
.row label{color:var(--fg2);font-size:15px;flex-shrink:0}
.row input,.row select,.row textarea{flex:1;min-width:0;border:0;background:transparent;outline:none;text-align:right}
.row.col input,.row.col select,.row.col textarea{text-align:left;background:var(--fill);border-radius:10px;padding:9px 11px}
.row textarea{resize:vertical}
.row .v{margin-left:auto;color:var(--fg2);text-align:right}
.row.danger{color:var(--red);justify-content:center;font-weight:500}
.ttl{font-size:16px;font-weight:600}
.sub{font-size:13px;color:var(--fg2)}
.chev{width:14px;height:14px;flex-shrink:0;color:var(--fg3)}
.av{width:38px;height:38px;flex-shrink:0;border-radius:11px;background:var(--accent-tint);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.av.round{border-radius:50%;background:var(--fill);color:var(--fg)}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;white-space:nowrap;background:var(--grey-t);color:var(--fg2)}
.pill.attivo,.pill.ok,.pill.evaso,.pill.confermato{background:var(--green-t);color:var(--green)}
.pill.trattativa,.pill.riordina,.pill.inviato,.pill.limitato,.pill.in_esaurimento{background:var(--orange-t);color:var(--orange)}
.pill.contattato,.pill.assegnazione{background:var(--blue-t);color:var(--blue)}
.pill.visitato,.pill.su_prenotazione{background:var(--purple-t);color:var(--purple)}
.pill.perso,.pill.annullato,.pill.esaurito{background:var(--red-t);color:var(--red)}
.pill.dormiente,.pill.in_arrivo{background:var(--gold-t);color:var(--gold)}
.btn{border:0;border-radius:12px;min-height:46px;padding:0 18px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--fill);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--border);color:var(--fg)}
.btn.sm{min-height:34px;font-size:14px;border-radius:9px;padding:0 13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--fill);border-radius:9px;padding:2px}
.seg button{border:0;border-radius:7px;min-height:32px;background:transparent;font-size:13px;font-weight:600;color:var(--fg)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;height:40px}
.search input{flex:1;border:0;background:transparent;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:15px;min-height:30px;padding:0 11px;font-size:13px;font-weight:500;background:var(--fill);color:var(--fg2)}
.chip.on{background:var(--accent-tint);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:1024px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.kpi .l{font-size:13px;color:var(--fg2);font-weight:500}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .n{font-size:12px;font-weight:600;color:var(--fg2)}
.grid2{display:grid;gap:14px}
@media (min-width:1024px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--card);border-radius:var(--r);padding:16px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar h1{flex:1;min-width:0}
.step{display:flex;align-items:center;background:var(--fill);border-radius:10px}
.step button{width:38px;height:44px;border:0;background:none;color:var(--accent);font-size:20px;line-height:1}
.step button[disabled]{color:var(--fg3);opacity:1}
.step .q{min-width:26px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.sheet{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;z-index:45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.modal>div{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;
  border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:720px){.modal{align-items:center}.modal>div{border-radius:18px;max-height:88vh}}
.empty{padding:34px 16px;text-align:center;color:var(--fg2)}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;
  animation:sp .7s linear infinite;margin:32px auto}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + 22px);transform:translateX(-50%);z-index:80;
  background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;
  max-width:88vw;box-shadow:0 6px 22px rgba(0,0,0,.25)}
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
#login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
#login .brand{font-family:Georgia,serif;font-size:30px;color:var(--accent);text-align:center;margin-bottom:6px}
.leaflet-tile-pane{filter:grayscale(1) contrast(.92) brightness(1.04)}
@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:grayscale(1) invert(1) contrast(.85) brightness(.85)}}
#map{position:absolute;inset:0}
</style>
</head>
<body>
<div id="root"><div class="spin"></div></div>

<script>
window.WA_CONFIG = {
  demo: false,           // true = backend finto in locale, nessun Supabase necessario
  supabaseUrl: "https://xnzqutbfmaofvsurmkxf.supabase.co",
  supabaseKey: "sb_publishable_8G0qe9wScbs1JjIhJ9Y3bA_8XN1LZ5o",
  schema: "crm",
  nome: "Wine Alchemist",
  zona: "Milano",
  mappaCentro: [45.4642, 9.19],
  cartone: 6            // passo dello stepper quantità
};
</script>
<script src="crm_map.js?v=3"></script>
<script src="crm_insights.js?v=3"></script>
<script src="crm_client_form.js?v=3"></script>
<script src="crm.js?v=3"></script>
<script>
// Diagnostica: se dopo 9 secondi l'app non è partita, dice cosa manca invece di girare a vuoto.
(function () {
  var errori = [];
  window.addEventListener('error', function (e) {
    errori.push((e.message || 'errore') + ' · ' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0));
  }, true);
  setTimeout(function () {
    if (window.CRM_AVVIATO) return;
    var parti = [
      ['crm_map.js', !!window.CrmMap], ['crm_insights.js', !!window.CrmInsights],
      ['crm_client_form.js', !!window.CrmClientForm], ['crm.js', !!window.CRM],
      ['libreria Supabase', !!window.supabase], ['Leaflet', !!window.L]
    ];
    document.getElementById('root').innerHTML =
      '<div id="login"><div style="max-width:420px;width:100%">' +
      '<div class="brand" style="text-align:center">Wine Alchemist</div>' +
      '<div class="inset" style="margin-top:16px;padding:14px 16px">' +
      '<div class="ttl">Avvio non riuscito</div>' +
      '<div class="sub" style="margin:8px 0">File caricati:</div>' +
      parti.map(function (p) {
        return '<div class="sub">' + (p[1] ? '✓ ' : '✕ ') + p[0] + '</div>';
      }).join('') +
      (errori.length ? '<div class="sub" style="margin-top:10px;color:var(--red)">' +
        errori.slice(0, 4).map(function (x) { return x.replace(/</g, '&lt;'); }).join('<br>') + '</div>'
        : '<div class="sub" style="margin-top:10px">Nessun errore JavaScript intercettato: probabile blocco di rete.</div>') +
      '</div>' +
      '<button class="btn" style="width:100%;margin-top:14px" onclick="location.reload(true)">Riprova</button>' +
      '</div></div>';
  }, 9000);
})();
</script>
</body>
</html>
